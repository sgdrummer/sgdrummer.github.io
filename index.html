<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a round in VOR</title>
<style>
  :root { --bg:#F5F5F5; --fg:#0A0A0A; --soft:rgba(10,10,10,0.6); --amber:#C49A28; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0A0A0A; --fg:#F5F5F5; --soft:rgba(245,245,245,0.6); } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font-family:-apple-system, system-ui, sans-serif; }
  main { max-width:340px; padding:24px 16px; }
  .mark { width:8px; height:8px; border-radius:50%; background:var(--amber); margin-bottom:24px; }
  h1 { font-size:28px; letter-spacing:0.02em; margin:0 0 16px; text-transform:uppercase; }
  p { font-size:15px; line-height:1.5; margin:0 0 12px; color:var(--soft); }
  b { color:var(--fg); }
</style>
</head>
<body>
<main>
  <div class="mark"></div>
  <h1>Join a round in VOR</h1>
  <p>Open VOR, tap <b>START</b>, <b>ON COURSE</b>, then <b>SCAN</b>, and scan your friend's code.</p>
  <p>VOR isn't on the App Store yet.</p>
</main>
</body>
</html>
